pipeline:
  name: java_project
  identifier: java_project
  projectIdentifier: agents
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: github_tony
        repoName: java_project
        build: <+input>
  stages:
    - stage:
        name: build
        identifier: build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: harnessk8s
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
          execution:
            steps:
              - step:
                  type: Run
                  name: explore_artifact_war_jar
                  identifier: explore_artifact_war_jar
                  spec:
                    shell: Sh
                    command: |-
                      set -e; ls
                      # exit 1
                  when:
                    stageStatus: Success
              - step:
                  type: Run
                  name: prerqstest
                  identifier: prerqstest
                  spec:
                    shell: Sh
                    command: |-
                      echo "DATABASE_URL: <+secrets.getValue(\"DATABASE_URL\")>"
                      #echo "DB_URL: <+secrets.getValue(\"DATABASE_URL\")>"
                  when:
                    stageStatus: Success
